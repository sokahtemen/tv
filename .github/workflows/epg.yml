name: Build EPG

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (some streaming guides only cover ~12 h)
  workflow_dispatch:         # adds a "Run workflow" button
    inputs:
      find:
        description: "Optional: list guide channel IDs matching this text (regex), e.g. africa|bloomberg"
        required: false
        default: ""
      extra:
        description: "Optional: extra guide URLs to try in this run (space-separated)"
        required: false
        default: ""

permissions:
  contents: write

# A manual run and a scheduled run never publish over each other
concurrency:
  group: epg
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Merge guides
        env:
          EPG_FIND: ${{ inputs.find }}
          EPG_EXTRA: ${{ inputs.extra }}
        run: python3 merge_epg.py

      - name: Publish to the epg branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir out && mv guide.xml.gz out/ && cd out
          git init -q -b epg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guide.xml.gz
          git commit -qm "EPG $(date -u +%F)"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" epg
