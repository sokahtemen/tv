name: Build Android app

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.10.2"

      # The runner is outside Hungary, so MTVA may geo-block the stream itself;
      # this checks that the page and player parsing still match MTVA's site.
      - name: Check MTVA stream lookup
        continue-on-error: true
        run: |
          mkdir -p /tmp/mtva
          javac -d /tmp/mtva android/app/src/main/java/hu/sokahtemen/mtva/MtvaProxy.java
          java -cp /tmp/mtva hu.sokahtemen.mtva.MtvaProxy --resolve
          java -Dmtva.youtube="Al Jazeera English|@aljazeeraenglish;DW News|https://www.youtube.com/@dwnews" -cp /tmp/mtva hu.sokahtemen.mtva.MtvaProxy --selftest

      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Publish download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk tvhub.apk
          # Replace the file in place, so the download link never disappears during an update
          gh release view tvhub >/dev/null 2>&1 || gh release create tvhub \
            --title "TV Hub for Android TV" --notes "Install on the TV stick; see README."
          gh release upload tvhub tvhub.apk --clobber
          gh release edit tvhub --notes "Build ${{ github.run_number }}. Install on the TV stick; see README."
          # The app used to be called MTVA Proxy; remove the old download
          gh release delete mtva-proxy --cleanup-tag --yes 2>/dev/null || true
